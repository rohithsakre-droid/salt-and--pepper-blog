<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile | Salt and Pepper</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Montserrat:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

    <header class="main-header">
        <nav class="navbar">
            <div class="nav-links-left">
                <a href="index.html">HOME</a>
                <a href="blog.html">BLOG</a>
                <a id="navLogin" href="login.html">LOGIN</a>
                <a id="navProfile" href="profile.html" class="active">PROFILE</a>
                <a href="about.html">ABOUT</a>
            </div>
            <a href="index.html" class="navbar-brand">SALT & PEPPER</a>
            <div class="nav-links-right">
                <a href="search.html"><img src="icons/search.png" alt="Search" class="icon"></a>
                <a href="https://www.facebook.com" target="_blank">
                    <img src="icons/facebook.png" alt="Facebook" class="icon">
                </a>
                <a href="https://www.twitter.com" target="_blank">
                    <img src="icons\twitter.png" alt="Twitter" class="icon">
                </a>
                <a href="https://www.instagram.com" target="_blank">
                    <img src="icons/instagram.jpg" alt="Instagram" class="icon">
                </a>
                <span id="userStatus" style="margin-left:12px;color:#fff;font-weight:700"></span>
                <a id="topLogoutBtn" href="#" style="margin-left:8px;display:none;color:#fff;">Logout</a>
            </div>
        </nav>
    </header>

    <main class="container">
        <section class="profile-section">
            <h2 class="section-title">Your Profile</h2>

            <div id="profileCard" class="profile-card">
                <div class="profile-avatar" id="avatar">A</div>
                <div class="profile-info">
                    <h3 id="displayName">Guest</h3>
                    <p id="displayEmail" class="muted">guest@example.com</p>
                    <p id="displayBio">No bio yet.</p>
                    <p class="muted" id="displayJoined">Joined: —</p>
                    <div class="profile-actions">
                        <button id="editBtn" class="btn">Edit Profile</button>
                        <button id="logoutBtn" class="btn btn-ghost">Logout</button>
                    </div>
                </div>
            </div>

            <form id="profileForm" class="profile-form hidden">
                <label>
                    Name
                    <input id="inputName" type="text" placeholder="Your name">
                </label>
                <label>
                    Email
                    <input id="inputEmail" type="email" placeholder="you@example.com">
                </label>
                <label>
                    Bio
                    <textarea id="inputBio" rows="4" placeholder="Short bio"></textarea>
                </label>
                <div class="form-actions">
                    <button type="submit" class="btn">Save</button>
                    <button type="button" id="cancelEdit" class="btn btn-ghost">Cancel</button>
                </div>
            </form>

        </section>
    </main>

    <footer class="main-footer">
        <p>&copy; 2025 by Salt & Pepper. Proudly created.</p>
    </footer>

    <script src="script.js"></script>
    <script>
        // Lightweight profile page integration that uses stored user info (from login/register).
        (function(){
            const displayName = document.getElementById('displayName');
            const displayEmail = document.getElementById('displayEmail');
            const displayBio = document.getElementById('displayBio');
            const displayJoined = document.getElementById('displayJoined');
            const avatar = document.getElementById('avatar');
            const editBtn = document.getElementById('editBtn');
            const form = document.getElementById('profileForm');
            const profileCard = document.getElementById('profileCard');

            function renderProfile(user, demo) {
                if (user) {
                    displayName.textContent = user.username || user.name || 'User';
                    displayEmail.textContent = user.email || '';
                    displayBio.textContent = demo && demo.bio ? demo.bio : 'This is your profile.';
                    displayJoined.textContent = 'Joined: ' + (demo && demo.joined ? demo.joined : '—');
                    avatar.textContent = (displayName.textContent && displayName.textContent[0]) ? displayName.textContent[0].toUpperCase() : 'U';
                } else {
                    displayName.textContent = 'Guest';
                    displayEmail.textContent = 'guest@example.com';
                    displayBio.textContent = 'No bio yet.';
                    displayJoined.textContent = 'Joined: —';
                    avatar.textContent = 'G';
                }
            }

            // Load stored user and optional demo profile
            const storedUser = localStorage.getItem('user');
            const demo = localStorage.getItem('demoProfile');
            const user = storedUser ? JSON.parse(storedUser) : null;
            const demoProfile = demo ? JSON.parse(demo) : null;
            renderProfile(user, demoProfile);

            // Small edit integration: populate with demo or user
            editBtn.addEventListener('click', () => {
                form.classList.remove('hidden');
                profileCard.classList.add('dimmed');
                document.getElementById('inputName').value = displayName.textContent !== 'Guest' ? displayName.textContent : '';
                document.getElementById('inputEmail').value = displayEmail.textContent !== 'guest@example.com' ? displayEmail.textContent : '';
                document.getElementById('inputBio').value = displayBio.textContent !== 'No bio yet.' ? displayBio.textContent : '';
            });

            document.getElementById('cancelEdit').addEventListener('click', () => {
                form.classList.add('hidden');
                profileCard.classList.remove('dimmed');
            });

            form.addEventListener('submit', (e) => {
                e.preventDefault();
                const updated = {
                    name: document.getElementById('inputName').value || displayName.textContent,
                    email: document.getElementById('inputEmail').value || displayEmail.textContent,
                    bio: document.getElementById('inputBio').value || displayBio.textContent,
                    joined: new Date().toLocaleDateString()
                };
                localStorage.setItem('demoProfile', JSON.stringify(updated));
                renderProfile(user, updated);
                form.classList.add('hidden');
                profileCard.classList.remove('dimmed');
                alert('Profile saved locally (demo).');
            });
        })();
    </script>
</body>
</html>
