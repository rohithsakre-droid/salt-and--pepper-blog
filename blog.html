<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog | Salt and Pepper</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Montserrat:wght@700&display=swap" rel="stylesheet">
</head>
<body>

    <header class="main-header">
        <nav class="navbar">
            <div class="nav-links-left">
                <a href="index.html">HOME</a>
                <a href="blog.html" class="active">BLOG</a>
                <a id="navLogin" href="login.html">LOGIN</a>
                <a id="navProfile" href="profile.html">PROFILE</a>
                <a href="about.html">ABOUT</a>
            </div>
            <a href="index.html" class="navbar-brand">SALT & PEPPER</a>
            <div class="nav-links-right">
                <a href="search.html">
                    <img src="icons/search.png" alt="Search" class="icon">
                </a>
                <a href="https://www.facebook.com" target="_blank">
                    <img src="icons/facebook.png" alt="Facebook" class="icon">
                </a>
                <a href="https://www.twitter.com" target="_blank">
                    <img src="icons\twitter.png" alt="Twitter" class="icon">
                </a>
                <a href="https://www.instagram.com" target="_blank">
                    <img src="icons/instagram.jpg" alt="Instagram" class="icon">
                </a>
                <span id="userStatus" style="margin-left:12px;color:#fff;font-weight:700"></span>
                <a id="topLogoutBtn" href="#" style="margin-left:8px;display:none;color:#fff;">Logout</a>
            </div>
        </nav>
    </header>

    <main class="container">
        <section class="page-content">
            <h2 class="section-title">ALL POSTS</h2>
            <p style="text-align: center;">
                This is the blog page. All your blog posts will be listed here.
            </p>
            <div id="createFormWrap" style="margin:20px 0;">
                <div class="create-post-card">
                    <h3 style="margin:0;">Create a post</h3>
                    <form id="createBlogForm" enctype="multipart/form-data">
                        <div class="form-row">
                            <div class="form-col">
                                <label for="blogTitle">Title</label>
                                <input id="blogTitle" name="title" type="text" required />
                            </div>
                            <div class="form-col" style="max-width:260px;flex:0 0 260px;">
                                <label>Preview</label>
                                <div class="image-preview" id="imagePreview">
                                    <img id="blogImagePreview" src="" alt="Preview" />
                                </div>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-col">
                                <label for="blogBody">Body</label>
                                <textarea id="blogBody" name="body" rows="6" required></textarea>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-col">
                                <label for="blogImage">Image (optional)</label>
                                <div class="file-input-wrap">
                                    <input id="blogImage" name="image" type="file" accept="image/*" />
                                </div>
                            </div>
                        </div>
                        <div class="create-post-actions">
                            <button type="submit" class="btn">Publish</button>
                        </div>
                    </form>
                </div>
            </div>

            <section id="postsSection">
                <h3>Posts</h3>
                <div id="blogsContainer"></div>
            </section>
            </section>
    </main>

    <footer class="main-footer">
        <p>&copy; 2025 by Salt & Pepper. Proudly created.</p>
    </footer>
    <script src="script.js"></script>

</body>
</html>
